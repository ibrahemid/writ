[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
exclude-dev = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 via webkit2gtk (Linux GTK3); the fix needs glib >= 0.20, i.e. Tauri on GTK4; Writ never iterates a VariantStr" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# The accepted list in about.toml, so the shipped notices and this check agree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openssl-sys", reason = "TLS is rustls only" },
    { crate = "native-tls", reason = "TLS is rustls only" },
    { crate = "aws-lc-sys", reason = "ring is the rustls provider" },
    { crate = "reqwest", wrappers = ["tauri-plugin-updater", "writ-ai", "writ-tauri"], reason = "writ-mcp and writ-cli make no outbound request (docs/threat-model.md, row 4)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The wry fork pinned in Cargo.toml [patch.crates-io] (#113).
allow-git = ["https://github.com/ibrahemid/wry.git"]
