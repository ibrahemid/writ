[package]
name = "writ-storage"
description = "SQLite-backed persistence and FTS5 search for the Writ editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
writ-core = { path = "../writ-core" }
rusqlite = { version = "0.40" }
toml = "1.1"
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
trash = "5"
ignore = "0.4.31"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"

[features]
bundled = ["rusqlite/bundled"]

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
writ-core = { path = "../writ-core" }
chrono = { version = "0.4", features = ["serde"] }

# Extended attributes and a file's creation date have no safe API in std, and
# both are lost by the rename a save performs (`atomic::metadata`).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "fullfsync"
harness = false
