# cargo-about configuration for THIRD-PARTY-NOTICES.md.
# Regenerate the notices with scripts/gen-third-party-notices.py.
#
# `accepted` is ordered: for a crate offering a choice ("MIT OR Apache-2.0"),
# cargo-about takes the first entry that appears here. Adding a licence to this
# list is a decision to ship under it, so keep the list to what has been read.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]

# Every triple a release artifact is built for (.github/workflows/release.yml).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

# Test and benchmark dependencies are not linked into any shipped artifact.
ignore-dev-dependencies = true

# Build dependencies are kept: proc macros and codegen crates contribute code
# to the compiled binaries.
ignore-build-dependencies = false
