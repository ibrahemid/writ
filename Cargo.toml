[workspace]
members = [
    "crates/writ-core",
    "crates/writ-lint",
    "crates/writ-render",
    "crates/writ-storage",
    "crates/writ-plugin",
    "crates/writ-cli",
    "crates/writ-mcp",
    "src-tauri",
]
# The fuzz crate is its own workspace (needs nightly + libfuzzer); keep it
# out of the merge-gate build so `cargo build/test --workspace` never pulls
# in libfuzzer or the nightly toolchain.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/ibrahemid/writ"
homepage = "https://github.com/ibrahemid/writ"
authors = ["Ibrahem ID <ibrahemid@gmail.com>"]
description = "Light text editor for any text file, with full-text search and inline Markdown"
readme = "README.md"
keywords = ["text-editor", "editor", "markdown", "tauri", "codemirror"]
categories = ["text-editors", "gui"]

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

# wry's macOS collect_paths() unwraps the propertyListForType read, which AppKit
# returns as nil for some drag and trackpad gestures (Writ #113). The panic
# unwinds out of an Objective-C callback and aborts the app on drop. Upstream
# wry still unwraps there as of 0.57.0. This pins a one-commit fork of
# wry-v0.55.1, the minor tauri-runtime-wry 2.11.4 requires (^0.55), whose only
# change is in src/wkwebview/drag_drop.rs: a nil or malformed filenames list
# yields no paths instead of a panic.
#   fork:   https://github.com/ibrahemid/wry/tree/fix/dragdrop-nil-pasteboard-0.55
#   diff:   wry-v0.55.1..a16da8ef85f1a08da3d3a6601d9a9a96381adb96
# Cargo drops a patch whose version no longer matches what tauri-runtime-wry
# requires, with only a warning and a [[patch.unused]] lock entry. When a tauri
# bump moves wry to another minor, rebase the fork onto that wry tag and re-pin;
# the wry_resolves_to_the_nil_safe_fork test and CI's [[patch.unused]] check
# fail until then. Delete this patch once a wry release reads the list nil-safe.
[patch.crates-io]
wry = { git = "https://github.com/ibrahemid/wry.git", rev = "a16da8ef85f1a08da3d3a6601d9a9a96381adb96" }
