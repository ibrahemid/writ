name: Question
description: Ask a question about using or building Writ
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Reproducible bugs and feature requests have their own templates.

        Check the [README](https://github.com/ibrahemid/writ#readme), [CONTRIBUTING.md](https://github.com/ibrahemid/writ/blob/main/CONTRIBUTING.md) and [docs/ARCHITECTURE.md](https://github.com/ibrahemid/writ/blob/main/docs/ARCHITECTURE.md) first.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and could not find an answer.
          required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you want to know?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What have you already tried? Link any relevant docs you have read.
    validations:
      required: false
