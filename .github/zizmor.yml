# Open findings in release.yml, cleared when its build and signing jobs are
# split. Each entry names a line, so an edit that moves one fails the audit.
rules:
  artipacked:
    ignore:
      - release.yml:29
      - release.yml:146
      - release.yml:588
  excessive-permissions:
    ignore:
      - release.yml:15
  cache-poisoning:
    ignore:
      - release.yml:180
      - release.yml:189
