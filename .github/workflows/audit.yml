name: Dependency audit

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: false

jobs:
  cargo:
    name: Rust advisories
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        env:
          RUSTUP_PERMIT_COPY_RENAME: 1
        run: rustup toolchain install --no-self-update

      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283  # v2.87.29
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check advisories
        run: cargo deny --locked check advisories

  npm:
    name: npm advisories
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - name: App dependencies
        run: pnpm audit --prod --audit-level high

      - name: Site dependencies
        run: pnpm --dir site audit --prod --audit-level high --ignore-workspace

  report:
    name: Report
    needs: [cargo, npm]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open or update the audit issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Dependency audit failed"
          number="$(gh issue list --state open --label dependencies --search "\"${title}\" in:title" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "Failed again: ${RUN_URL}"
          else
            gh issue create --title "${title}" --label dependencies \
              --body "The scheduled dependency audit found an advisory: ${RUN_URL}"
          fi
