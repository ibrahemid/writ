name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must exist, e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Signing secrets live in the `release` environment, and only the sign-* jobs
# and signing-config name it. Those jobs run Apple's tools, pinned minisign and
# the repository's own scripts; sign-windows adds the Tauri CLI, installed with
# package scripts off, which runs signtool and its WiX tools. No dependency
# build script, proc macro or Vite plugin runs beside a key. Only publish can
# write repository contents; publish and attest-sboms can also mint an OIDC
# token and write attestations. No job restores or saves an Actions cache.
jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sbom_matrix: ${{ steps.sboms.outputs.matrix }}
    steps:
      # A manual run works in the cache scope of the branch it was started
      # from, usually main, and every job checks out the tag it names. Before
      # anything is checked out, that tag must exist and its commit must
      # already be on the default branch.
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if [[ ! "$TAG" =~ $TAG_PATTERN ]]; then
            printf '::error::Refusing to release %q: a release tag is v<major>.<minor>.<patch>, with an optional -<candidate> suffix\n' "$TAG"
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$DEFAULT_BRANCH" ]; then
              echo "::error::The event names no default branch to check $TAG against"
              exit 1
            fi
            export GIT_TERMINAL_PROMPT=0
            CHECK="$RUNNER_TEMP/release-tag-check.git"
            git init --quiet --bare "$CHECK"
            git -C "$CHECK" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
            if ! git -C "$CHECK" fetch --quiet --no-tags --filter=tree:0 origin "+refs/heads/$DEFAULT_BRANCH:refs/heads/$DEFAULT_BRANCH"; then
              echo "::error::Could not fetch $DEFAULT_BRANCH to check $TAG against"
              exit 1
            fi
            if ! git -C "$CHECK" fetch --quiet --no-tags --filter=tree:0 origin "+refs/tags/$TAG:refs/tags/$TAG"; then
              if git -C "$CHECK" ls-remote --exit-code origin "refs/heads/$TAG" > /dev/null; then
                echo "::error::$TAG is a branch, not a tag. A manual run releases an existing tag."
              else
                echo "::error::No tag named $TAG exists."
              fi
              exit 1
            fi
            if ! COMMIT="$(git -C "$CHECK" rev-parse --verify --quiet "refs/tags/$TAG^{commit}")"; then
              echo "::error::Tag $TAG does not point to a commit."
              exit 1
            fi
            STATUS=0
            git -C "$CHECK" merge-base --is-ancestor "$COMMIT" "refs/heads/$DEFAULT_BRANCH" || STATUS=$?
            if [ "$STATUS" -eq 1 ]; then
              echo "::error::Tag $TAG ($COMMIT) is not on $DEFAULT_BRANCH. A manual run releases only a tag whose commit is already on $DEFAULT_BRANCH."
              exit 1
            elif [ "$STATUS" -ne 0 ]; then
              echo "::error::Could not check whether $TAG is on $DEFAULT_BRANCH: git merge-base exited with $STATUS."
              exit 1
            fi
            echo "$TAG ($COMMIT) is on $DEFAULT_BRANCH"
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # The site regenerates release.json at deploy, so a committed copy naming
      # an older release is invisible until the download page serves the wrong
      # links. A tag build stops here instead.
      - name: Check site/src/data/release.json names this release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: node scripts/check-release-json.mjs --tag "$TAG"

      - name: Generate changelog from conventional commits
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release_notes.py > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: List the SBOMs to attest
        id: sboms
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          MATRIX="$(python3 .github/scripts/release_assets.py sbom-matrix --version "$VERSION")"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: CHANGELOG_RELEASE.md
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build (${{ matrix.label }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (universal)
            platform: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            label: Windows (x64)
            platform: windows
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc
            bundles: msi
          - os: ubuntu-22.04
            label: Linux (x64)
            platform: linux
            rust_targets: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu
            bundles: deb,appimage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag_name }}
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: 1
          RUST_TARGETS: ${{ matrix.rust_targets }}
        run: |
          set -euo pipefail
          rustup toolchain install --no-self-update
          IFS=',' read -ra TRIPLES <<< "$RUST_TARGETS"
          rustup target add "${TRIPLES[@]}"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            squashfs-tools

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI sidecar
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.rust_targets }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          IFS=',' read -ra TRIPLES <<< "$RUST_TARGETS"
          for t in "${TRIPLES[@]}"; do
            cargo build -p writ-cli --release --locked --target "$t"
          done
          case "$MATRIX_OS" in
            macos-latest)
              # The universal target builds each arch separately; every pass
              # resolves the sidecar by its own triple, so all three names
              # must exist.
              cp target/aarch64-apple-darwin/release/writ \
                src-tauri/binaries/writ-aarch64-apple-darwin
              cp target/x86_64-apple-darwin/release/writ \
                src-tauri/binaries/writ-x86_64-apple-darwin
              lipo -create \
                target/aarch64-apple-darwin/release/writ \
                target/x86_64-apple-darwin/release/writ \
                -output src-tauri/binaries/writ-universal-apple-darwin
              ;;
            windows-latest)
              cp target/x86_64-pc-windows-msvc/release/writ.exe \
                src-tauri/binaries/writ-x86_64-pc-windows-msvc.exe
              ;;
            ubuntu-22.04)
              cp target/x86_64-unknown-linux-gnu/release/writ \
                src-tauri/binaries/writ-x86_64-unknown-linux-gnu
              ;;
          esac

      # tauri-bundler saves the AppRun it downloads as 0770 and the AppImage
      # keeps that mode, so a kernel-mounted image (firejail, the AppImage
      # catalog) cannot start it as a regular user. The bundler reuses a cached
      # copy, so seeding the cache with a 0755 one fixes the packed mode.
      - name: Seed AppRun with world-execute permission
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        env:
          APPRUN_URL: https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          APPRUN_SHA256: f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f
        run: |
          set -euo pipefail
          TOOLS_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TOOLS_DIR"
          curl -fsSL --retry 3 -o "$TOOLS_DIR/AppRun-x86_64" "$APPRUN_URL"
          echo "$APPRUN_SHA256  $TOOLS_DIR/AppRun-x86_64" | sha256sum -c -
          chmod 0755 "$TOOLS_DIR/AppRun-x86_64"

      # The release profile packs line tables into a file beside the binary and
      # strips the binary (ADR-045). On Linux that leaves a .dwp the stripped
      # binary no longer points at, so this leg keeps them in the binary until
      # the split step below moves them to writ-tauri.debug.
      - name: Keep the Linux line tables for the symbol split
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CARGO_PROFILE_RELEASE_STRIP=false"
            echo "CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=off"
          } >> "$GITHUB_ENV"

      # Unsigned: updater signatures, Developer ID and Windows signing happen in
      # the sign-* jobs. The macOS bundle is ad-hoc signed until sign-macos
      # replaces that, and the bundler skips the dmg's Finder layout on CI
      # unless TAURI_BUNDLER_DMG_IGNORE_CI is set.
      - name: Build Tauri app
        shell: bash
        env:
          TAURI_ARGS: ${{ matrix.tauri_args }}
          BUNDLES: ${{ matrix.bundles }}
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          set -euo pipefail
          read -ra TARGET_ARGS <<< "$TAURI_ARGS"
          pnpm exec tauri build "${TARGET_ARGS[@]}" --bundles "$BUNDLES" --ci --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked

      # Moves the line tables into writ-tauri.debug, strips the binary as the
      # release profile does on the other platforms, and bundles again from the
      # stripped binary.
      - name: Split off the Linux debug symbols and bundle again
        if: matrix.platform == 'linux'
        shell: bash
        env:
          TAURI_ARGS: ${{ matrix.tauri_args }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-gnu/release/writ-tauri
          objcopy --only-keep-debug "$BIN" "$BIN.debug"
          objcopy --strip-all "$BIN"
          objcopy --add-gnu-debuglink="$BIN.debug" "$BIN"
          if readelf -S "$BIN" | grep -q '\.debug_'; then
            echo "$BIN still holds debug sections" >&2
            exit 1
          fi
          read -ra TARGET_ARGS <<< "$TAURI_ARGS"
          pnpm exec tauri bundle "${TARGET_ARGS[@]}" --bundles "$BUNDLES" --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'
      # The AppImage carries GTK and WebKitGTK libraries from this runner, LGPL
      # among them. Their notices and the offer of their source go into the
      # notices file, and the AppImage is bundled again so it ships them.
      - name: Credit the AppImage's system libraries
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        env:
          TAURI_ARGS: ${{ matrix.tauri_args }}
        run: |
          set -euo pipefail
          APPIMAGE="$(ls target/x86_64-unknown-linux-gnu/release/bundle/appimage/Writ_*_amd64.AppImage)"
          python3 scripts/gen-linux-library-notices.py append --appimage "$APPIMAGE" --notices THIRD-PARTY-NOTICES.md
          read -ra TARGET_ARGS <<< "$TAURI_ARGS"
          pnpm exec tauri bundle "${TARGET_ARGS[@]}" --bundles appimage --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'
          python3 scripts/gen-linux-library-notices.py check --appimage "$APPIMAGE"

      - name: Require every AppImage file to be readable and runnable by any user
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(ls target/x86_64-unknown-linux-gnu/release/bundle/appimage/Writ_*_amd64.AppImage)"
          # The squashfs image starts where the runtime's ELF section headers end.
          SHOFF="$(od -An -t u8 -j 40 -N 8 "$APPIMAGE" | tr -d ' ')"
          SHENTSIZE="$(od -An -t u2 -j 58 -N 2 "$APPIMAGE" | tr -d ' ')"
          SHNUM="$(od -An -t u2 -j 60 -N 2 "$APPIMAGE" | tr -d ' ')"
          OFFSET=$((SHOFF + SHENTSIZE * SHNUM))
          LISTING="$(unsquashfs -lln -o "$OFFSET" "$APPIMAGE")"
          if ! grep -q ' squashfs-root/AppRun$' <<<"$LISTING"; then
            echo "no AppRun in $APPIMAGE" >&2
            exit 1
          fi
          UNREACHABLE="$(awk '$1 ~ /^[-d]/ {
            m = $1
            ox = substr(m, 10, 1) ~ /[xt]/
            if (substr(m, 8, 1) != "r" || (substr(m, 1, 1) == "d" && !ox) || (substr(m, 4, 1) ~ /[xs]/ && !ox)) print
          }' <<<"$LISTING")"
          if [ -n "$UNREACHABLE" ]; then
            echo "files in $APPIMAGE that other users cannot read or run:" >&2
            echo "$UNREACHABLE" >&2
            exit 1
          fi

      - name: Stage the build for signing
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          case "$MATRIX_OS" in
            macos-latest)
              mkdir -p dist/build-macos
              cp "target/universal-apple-darwin/release/bundle/dmg/Writ_${VERSION}_universal.dmg" dist/build-macos/
              ;;
            windows-latest)
              mkdir -p dist/build-windows dist/build-windows-binaries
              cp "target/x86_64-pc-windows-msvc/release/bundle/msi/Writ_${VERSION}_x64_en-US.msi" dist/build-windows/
              # tauri bundle reads these when sign-windows rebuilds the MSI around signed binaries.
              cp target/x86_64-pc-windows-msvc/release/writ-tauri.exe dist/build-windows-binaries/
              cp src-tauri/binaries/writ-x86_64-pc-windows-msvc.exe dist/build-windows-binaries/
              ;;
            ubuntu-22.04)
              mkdir -p dist/build-linux
              cp "target/x86_64-unknown-linux-gnu/release/bundle/deb/Writ_${VERSION}_amd64.deb" dist/build-linux/
              cp "target/x86_64-unknown-linux-gnu/release/bundle/appimage/Writ_${VERSION}_amd64.AppImage" dist/build-linux/
              ;;
          esac
          ls -la dist/*

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-${{ matrix.platform }}
          path: dist/build-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Windows binaries for signing
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-windows-binaries
          path: dist/build-windows-binaries/
          if-no-files-found: error
          retention-days: 14

      - name: Collect the debug symbols
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          OUT="dist/debug-symbols-$PLATFORM"
          case "$MATRIX_OS" in
            macos-latest)
              python3 .github/scripts/debug_symbols.py dsym --out "$OUT" \
                target/aarch64-apple-darwin/release/writ-tauri.dSYM \
                target/x86_64-apple-darwin/release/writ-tauri.dSYM
              ;;
            windows-latest)
              python .github/scripts/debug_symbols.py pdb --out "$OUT" \
                --exe target/x86_64-pc-windows-msvc/release/writ-tauri.exe \
                target/x86_64-pc-windows-msvc/release/writ_tauri.pdb
              ;;
            ubuntu-22.04)
              python3 .github/scripts/debug_symbols.py elf --out "$OUT" \
                --binary target/x86_64-unknown-linux-gnu/release/writ-tauri \
                target/x86_64-unknown-linux-gnu/release/writ-tauri.debug
              ;;
          esac

      # Kept with the run and never attached to the release. A crash report's
      # build ID names the directory that holds its symbols (ADR-045).
      - name: Upload the debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: debug-symbols-${{ matrix.platform }}-${{ needs.plan.outputs.version }}
          path: dist/debug-symbols-${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 90

  sbom:
    name: SBOMs
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag_name }}
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: 1
        run: rustup toolchain install --no-self-update

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8  # v2.87.28
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Install cdxgen
        shell: bash
        env:
          CDXGEN_VERSION: 13.3.0
          CDXGEN_SHA256: c36176e44afdbb76282915ccb1d0f059e0b36e4a2c77648b6c3c0515e8d5b161
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cdxgen" \
            "https://github.com/CycloneDX/cdxgen/releases/download/v${CDXGEN_VERSION}/cdxgen-linux-amd64-slim"
          echo "$CDXGEN_SHA256  $RUNNER_TEMP/cdxgen" | sha256sum --check --strict -
          chmod 0755 "$RUNNER_TEMP/cdxgen"

      - name: Generate the SBOMs
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # cargo-cyclonedx has no --locked flag; this stops the job first if
          # Cargo.lock would change.
          cargo metadata --locked --format-version 1 > /dev/null
          mkdir -p dist/sboms
          TARGETS="$(python3 .github/scripts/release_assets.py sbom-targets)"
          while IFS= read -r target; do
            cargo cyclonedx --format json --spec-version 1.5 --target "$target" -q
            mv src-tauri/writ-tauri.cdx.json "dist/sboms/writ-tauri_${VERSION}_${target}.cdx.json"
            mv crates/writ-cli/writ-cli.cdx.json "dist/sboms/writ-cli_${VERSION}_${target}.cdx.json"
          done <<< "$TARGETS"
          "$RUNNER_TEMP/cdxgen" -t js --no-recurse --no-install-deps --no-babel --spec-version 1.6 \
            -o "dist/sboms/writ-frontend_${VERSION}.cdx.json" .
          python3 .github/scripts/release_assets.py check --dir dist/sboms --version "$VERSION" --set sboms

      - name: Upload the SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sboms
          path: dist/sboms/
          if-no-files-found: error
          retention-days: 14

  # A job-level `if` cannot read secrets, so this job turns the presence of the
  # Windows signing secrets into an output that sign-windows can test.
  signing-config:
    name: Signing configuration
    needs: plan
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    outputs:
      windows: ${{ steps.windows.outputs.configured }}
    steps:
      - name: Check for a Windows signing account
        id: windows
        shell: bash
        env:
          CONFIGURED: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' }}
        run: |
          set -euo pipefail
          echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"
          if [ "$CONFIGURED" != "true" ]; then
            echo "no Windows signing account in the release environment; the MSI ships unsigned"
          fi

  sign-macos:
    name: Sign (macOS)
    needs: [plan, build]
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag_name }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/archive_app.py
            scripts/build-mac-pkg.sh
            scripts/macos-release.sh
            /Cargo.toml

      - name: Download the macOS build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: build-macos
          path: build-macos

      - name: Import Apple Developer ID certificates
        if: env.APPLE_CERTIFICATE != '' || env.APPLE_INSTALLER_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          SEARCH_LIST=("$KEYCHAIN_PATH")
          while IFS= read -r EXISTING_KEYCHAIN; do
            SEARCH_LIST+=("$EXISTING_KEYCHAIN")
          done < <(security list-keychains -d user | sed -n 's/^[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p')
          security list-keychain -d user -s "${SEARCH_LIST[@]}"
          # Developer ID Installer is a separate certificate from Developer ID
          # Application: the first signs the .pkg wrapper through productsign,
          # the second signs the .app, and either may be configured alone.
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security import "$RUNNER_TEMP/certificate.p12" \
              -k "$KEYCHAIN_PATH" \
              -P "$APPLE_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/security
            rm -f "$RUNNER_TEMP/certificate.p12"
          else
            echo "APPLE_CERTIFICATE absent; the .app will not carry a Developer ID signature"
          fi
          if [ -n "${APPLE_INSTALLER_CERTIFICATE:-}" ]; then
            echo "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" \
              -k "$KEYCHAIN_PATH" \
              -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" \
              -T /usr/bin/productsign \
              -T /usr/bin/security
            rm -f "$RUNNER_TEMP/installer.p12"
          else
            echo "APPLE_INSTALLER_CERTIFICATE absent; the .pkg will not be signed"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign the app
        env:
          HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/macos/Writ.app"
          mkdir -p "$RUNNER_TEMP/macos"
          bash scripts/macos-release.sh extract-app "build-macos/Writ_${VERSION}_universal.dmg" "$APP"
          if [ "$HAS_APPLE_CERT" != "true" ]; then
            echo "no Developer ID Application certificate; the app keeps the build's ad-hoc signature"
            echo "APP_SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          IDENTITY="${APPLE_SIGNING_IDENTITY:-}"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk -F'"' '/Developer ID Application/{print $2; exit}' || true)"
          fi
          if [ -z "$IDENTITY" ]; then
            echo "APPLE_CERTIFICATE is set but no Developer ID Application identity reached the keychain: check APPLE_CERTIFICATE_PASSWORD" >&2
            exit 1
          fi
          bash scripts/macos-release.sh sign-app "$APP" "$IDENTITY" "$KEYCHAIN_PATH"
          {
            echo "APP_SIGNED=true"
            echo "APP_SIGNING_IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Notarize and staple the app
        if: env.APP_SIGNED == 'true'
        env:
          HAS_APPLE_NOTARIZE: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$HAS_APPLE_NOTARIZE" != "true" ]; then
            echo "notarization secrets absent; the app ships signed but without a ticket"
            exit 0
          fi
          bash scripts/macos-release.sh notarize "$RUNNER_TEMP/macos/Writ.app"
          echo "APP_STAPLED=true" >> "$GITHUB_ENV"

      - name: Build .pkg installer
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            IDENTITY="$(security find-identity -v "$KEYCHAIN_PATH" \
              | awk -F'"' '/Developer ID Installer/{print $2; exit}' || true)"
            if [ -n "$IDENTITY" ]; then
              export WRIT_INSTALLER_SIGNING_IDENTITY="$IDENTITY"
            fi
          fi
          export WRIT_APP_PATH="$RUNNER_TEMP/macos/Writ.app"
          export WRIT_PKG_OUT_DIR="$GITHUB_WORKSPACE/dist/signed-macos"
          bash scripts/build-mac-pkg.sh

      - name: Notarize and staple the pkg
        env:
          HAS_INSTALLER_CERT: ${{ secrets.APPLE_INSTALLER_CERTIFICATE != '' }}
          HAS_APPLE_NOTARIZE: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          PKG="dist/signed-macos/Writ_${VERSION}_universal.pkg"
          PKG_SIGNED=false
          PKG_NOTARIZED=false
          PKG_STAPLED=false
          # Read the signature into a variable rather than piping it: a reader
          # that exits on the first match can leave pkgutil killed by SIGPIPE,
          # and under pipefail a signed pkg would then read as unsigned.
          PKG_SIGNATURE="$(pkgutil --check-signature "$PKG" 2>&1 || true)"
          case "$PKG_SIGNATURE" in
            *"Developer ID Installer"*) PKG_SIGNED=true ;;
          esac
          # Configured but unsigned means the identity did not resolve. Shipping
          # that quietly is the exact state this pipeline exists to prevent.
          if [ "$PKG_SIGNED" != "true" ] && [ "$HAS_INSTALLER_CERT" = "true" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
            if [ ! -f "$KEYCHAIN_PATH" ]; then
              echo "APPLE_INSTALLER_CERTIFICATE is set but $KEYCHAIN_PATH does not exist: the certificate import step never ran" >&2
            else
              IDENTITIES="$(security find-identity -v "$KEYCHAIN_PATH" 2>&1 || true)"
              case "$IDENTITIES" in
                *"Developer ID Installer"*)
                  echo "APPLE_INSTALLER_CERTIFICATE is set and the identity is in the keychain, but productsign left the pkg unsigned" >&2
                  ;;
                *)
                  echo "APPLE_INSTALLER_CERTIFICATE is set but no Developer ID Installer identity reached the keychain: check APPLE_INSTALLER_CERTIFICATE_PASSWORD and that the secret holds a base64 Developer ID Installer .p12" >&2
                  ;;
              esac
              echo "$IDENTITIES" >&2
            fi
            echo "$PKG_SIGNATURE" >&2
            exit 1
          fi
          if [ "$PKG_SIGNED" != "true" ]; then
            echo "no installer certificate configured; pkg ships unsigned and Gatekeeper will reject it"
          elif [ "$HAS_APPLE_NOTARIZE" != "true" ]; then
            echo "notarization secrets absent; pkg ships signed but without a ticket"
          else
            bash scripts/macos-release.sh notarize "$PKG"
            PKG_NOTARIZED=true
            PKG_STAPLED=true
          fi
          {
            echo "PKG_SIGNED=$PKG_SIGNED"
            echo "PKG_NOTARIZED=$PKG_NOTARIZED"
            echo "PKG_STAPLED=$PKG_STAPLED"
          } >> "$GITHUB_ENV"

      # The dmg the build made keeps its window layout and volume icon; the
      # bundle inside it is swapped for the signed one, and the wrapper then
      # needs its own signature and ticket.
      - name: Repack, sign, notarize and staple the dmg
        env:
          HAS_APPLE_NOTARIZE: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          DMG="dist/signed-macos/Writ_${VERSION}_universal.dmg"
          bash scripts/macos-release.sh repack-dmg \
            "build-macos/Writ_${VERSION}_universal.dmg" "$RUNNER_TEMP/macos/Writ.app" "$DMG"
          if [ "${APP_SIGNED:-false}" != "true" ]; then
            echo "the app is not Developer ID signed; the dmg ships unsigned and unnotarized"
            echo "DMG_STAPLED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          codesign --force --sign "$APP_SIGNING_IDENTITY" --keychain "$RUNNER_TEMP/build.keychain-db" --timestamp "$DMG"
          if [ "$HAS_APPLE_NOTARIZE" != "true" ]; then
            echo "notarization secrets absent; dmg ships signed but without a ticket"
            echo "DMG_STAPLED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          bash scripts/macos-release.sh notarize "$DMG"
          echo "DMG_STAPLED=true" >> "$GITHUB_ENV"

      # Apple removed the Control-click override in Sequoia, so a build without
      # a ticket sends the person to System Settings to allow it. A release
      # that macOS will not open is not a release, and this says so rather than
      # the release notes saying it.
      - name: Require the mac artifacts to be notarized
        env:
          # Only this repository holds the signing secrets. A fork builds and
          # says so instead of failing on secrets it cannot have.
          REQUIRED: ${{ github.repository == 'ibrahemid/writ' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REQUIRED" != "true" ]; then
            echo "no signing secrets belong to this repository; notarization is not required of this run"
            exit 0
          fi
          FAILED=false
          if [ "${APP_STAPLED:-false}" != "true" ]; then
            echo "the app the updater installs is not notarized and stapled" >&2
            FAILED=true
          fi
          if [ "${PKG_STAPLED:-false}" != "true" ]; then
            echo "the pkg is not notarized and stapled" >&2
            FAILED=true
          fi
          if [ "${DMG_STAPLED:-false}" != "true" ]; then
            echo "the dmg is not notarized and stapled" >&2
            FAILED=true
          fi
          if [ "$FAILED" = "true" ]; then
            echo "refusing to finish a release macOS would ask the person to allow by hand" >&2
            exit 1
          fi
          echo "the app, the pkg and the dmg are notarized and stapled"

      - name: Archive the app for the updater
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/archive_app.py create \
            "$RUNNER_TEMP/macos/Writ.app" "dist/signed-macos/Writ_${VERSION}_universal.app.tar.gz"

      # The site reads this to decide whether it may show a notarized badge.
      - name: Write release-meta.json
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --argjson pkgSigned "${PKG_SIGNED:-false}" \
            --argjson pkgNotarized "${PKG_NOTARIZED:-false}" \
            --argjson pkgStapled "${PKG_STAPLED:-false}" \
            --argjson dmgStapled "${DMG_STAPLED:-false}" \
            '{schema:1,
              pkg:{signed:$pkgSigned,notarized:$pkgNotarized,stapled:$pkgStapled},
              dmg:{stapled:$dmgStapled}}' > dist/signed-macos/release-meta.json
          cat dist/signed-macos/release-meta.json
          ls -la dist/signed-macos

      - name: Upload the signed macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: signed-macos
          path: dist/signed-macos/
          if-no-files-found: error
          retention-days: 14

  sign-windows:
    name: Sign (Windows)
    needs: [plan, build, signing-config]
    if: needs.signing-config.outputs.windows == 'true'
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag_name }}
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: 1
        run: rustup toolchain install --no-self-update

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 10.13.1
          run_install: false

      # setup-node is given no cache input, so it restores none; a signing job
      # restores no cache.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # Only the Tauri CLI runs in this job: package scripts stay off and no
      # build or frontend tooling is invoked.
      - name: Install the Tauri CLI
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the Windows binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: build-windows-binaries
          path: build-windows-binaries

      - name: Put the binaries where the bundler reads them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/x86_64-pc-windows-msvc/release src-tauri/binaries
          cp build-windows-binaries/writ-tauri.exe target/x86_64-pc-windows-msvc/release/
          cp build-windows-binaries/writ-x86_64-pc-windows-msvc.exe src-tauri/binaries/

      - name: Install the Artifact Signing client
        shell: bash
        env:
          CLIENT_VERSION: 1.0.146
          CLIENT_SHA256: 7761e5d8f31e54b764da21d33cd8b0a2940e1b05526c7dfcb5e94b0431426f70
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/artifact-signing"
          mkdir -p "$DIR"
          curl -fsSL --retry 3 -o "$DIR/client.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/${CLIENT_VERSION}/microsoft.artifactsigning.client.${CLIENT_VERSION}.nupkg"
          echo "$CLIENT_SHA256  $DIR/client.nupkg" | sha256sum --check --strict -

      - name: Write the sign command
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          SIGNTOOL=""
          for candidate in "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe; do
            if [ -f "$candidate" ]; then
              SIGNTOOL="$candidate"
            fi
          done
          if [ -z "$SIGNTOOL" ]; then
            echo "no signtool.exe in the Windows SDK on this runner" >&2
            exit 1
          fi
          python .github/scripts/windows_signing.py \
            --client-package "$(cygpath -w "$RUNNER_TEMP/artifact-signing/client.nupkg")" \
            --signtool "$(cygpath -w "$SIGNTOOL")" \
            --endpoint "$AZURE_SIGNING_ENDPOINT" \
            --account "$AZURE_SIGNING_ACCOUNT" \
            --profile "$AZURE_SIGNING_PROFILE" \
            --out-dir "$RUNNER_TEMP/windows-signing"

      # The bundler signs the sidecar, then the main executable, then the MSI
      # through bundle.windows.signCommand.
      - name: Bundle and sign the MSI
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          pnpm exec tauri bundle --target x86_64-pc-windows-msvc --bundles msi --ci \
            --config "$RUNNER_TEMP/windows-signing/tauri.windows-signing.conf.json"

      - name: Require a valid signature on the MSI
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $msi = "target/x86_64-pc-windows-msvc/release/bundle/msi/Writ_$($env:VERSION)_x64_en-US.msi"
          $signature = Get-AuthenticodeSignature -FilePath $msi
          if ($signature.Status -ne 'Valid') {
            Write-Error "the MSI signature is $($signature.Status): $($signature.StatusMessage)"
            exit 1
          }
          Write-Output "signed by $($signature.SignerCertificate.Subject)"
          New-Item -ItemType Directory -Force -Path dist/signed-windows | Out-Null
          Copy-Item $msi dist/signed-windows/

      - name: Upload the signed MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: signed-windows
          path: dist/signed-windows/
          if-no-files-found: error
          retention-days: 14

  sign-updater:
    name: Sign updater payloads and checksums
    needs: [plan, build, sbom, signing-config, sign-macos, sign-windows]
    # Runs when Windows signing is skipped for want of an account, and not when
    # an account exists but the Windows job failed or never ran.
    if: >-
      ${{ !cancelled()
      && needs.plan.result == 'success'
      && needs.build.result == 'success'
      && needs.sbom.result == 'success'
      && needs.signing-config.result == 'success'
      && needs.sign-macos.result == 'success'
      && (needs.sign-windows.result == 'success'
        || (needs.sign-windows.result == 'skipped' && needs.signing-config.outputs.windows != 'true')) }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag_name }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts
            scripts/install-minisign.sh
            src-tauri/tauri.conf.json

      - name: Install minisign
        id: minisign
        shell: bash
        run: |
          set -euo pipefail
          MINISIGN="$(bash scripts/install-minisign.sh "$RUNNER_TEMP/minisign")"
          echo "path=$MINISIGN" >> "$GITHUB_OUTPUT"

      - name: Download the Linux build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: build-linux
          path: release-assets

      - name: Download the signed macOS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signed-macos
          path: release-assets

      - name: Download the signed MSI
        if: needs.sign-windows.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signed-windows
          path: release-assets

      - name: Download the unsigned MSI
        if: needs.sign-windows.result != 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: build-windows
          path: release-assets

      - name: Download the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sboms
          path: release-assets

      - name: Require exactly the files this release signs
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: python3 .github/scripts/release_assets.py check --dir release-assets --version "$VERSION" --set signing-inputs

      # Installed copies verify an update against the key built into them, which
      # is the key of the latest published release. A key transition release is
      # signed with that key while it carries the next one (RELEASING.md 1.5).
      - name: Find the key installed copies trust
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TRUSTED="$RUNNER_TEMP/trusted-tauri.conf.json"
          if LATEST="$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>&1)"; then
            LATEST_TAG="$LATEST"
          elif grep -q 'HTTP 404' <<<"$LATEST"; then
            LATEST_TAG=""
          else
            echo "could not read the latest release: $LATEST" >&2
            exit 1
          fi
          if [ -n "$LATEST_TAG" ]; then
            gh api -H "Accept: application/vnd.github.raw+json" \
              "repos/$REPO/contents/src-tauri/tauri.conf.json?ref=$LATEST_TAG" > "$TRUSTED"
            echo "installed copies trust the updater key of $LATEST_TAG"
          else
            cp src-tauri/tauri.conf.json "$TRUSTED"
            echo "no published release yet; trusting the key this tag carries"
          fi

      - name: Sign the updater payloads and the checksums
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MINISIGN: ${{ steps.minisign.outputs.path }}
          VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          NAMES="$(python3 .github/scripts/release_assets.py list --version "$VERSION" --set updater-payloads)"
          PAYLOADS=()
          while IFS= read -r name; do
            PAYLOADS+=("release-assets/$name")
          done <<< "$NAMES"
          python3 .github/scripts/release_signing.py sign-payloads --version "$VERSION" "${PAYLOADS[@]}"
          python3 .github/scripts/release_signing.py sign-sums --version "$VERSION" --dir release-assets

      - name: Build latest.json updater manifest
        working-directory: release-assets
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 ../.github/scripts/build_latest_json.py

      - name: Verify the signed release
        env:
          MINISIGN: ${{ steps.minisign.outputs.path }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release_signing.py verify-release \
            --version "$VERSION" --tag "$TAG" --repo "$REPO" --dir release-assets \
            --pubkey-from "$RUNNER_TEMP/trusted-tauri.conf.json"

      - name: Stage the signatures, checksums and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/signed-updater
          cp release-assets/*.sig release-assets/SHA256SUMS.txt release-assets/SHA256SUMS.txt.minisig \
            release-assets/latest.json dist/signed-updater/
          cat dist/signed-updater/SHA256SUMS.txt

      - name: Upload the signatures, checksums and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: signed-updater
          path: dist/signed-updater/
          if-no-files-found: error
          retention-days: 14

  attest-sboms:
    name: Attest SBOM (${{ matrix.sbom }})
    needs: [plan, sign-updater]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.sign-updater.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        # act --dryrun leaves job outputs empty; a real run always has the plan's list.
        include: ${{ fromJSON(needs.plan.outputs.sbom_matrix || '[]') }}
    steps:
      - name: Download the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sboms
          path: sboms

      - name: Download the checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signed-updater
          path: signed-updater

      - name: List the artifacts the SBOM describes
        env:
          SUBJECTS: ${{ matrix.subjects }}
        shell: bash
        run: |
          set -euo pipefail
          read -ra NAMES <<< "$SUBJECTS"
          : > subjects.sha256
          for name in "${NAMES[@]}"; do
            line="$(awk -v name="$name" '$2 == name' signed-updater/SHA256SUMS.txt)"
            if [ -z "$line" ]; then
              echo "$name is not listed in SHA256SUMS.txt" >&2
              exit 1
            fi
            printf '%s\n' "$line" >> subjects.sha256
          done
          cat subjects.sha256

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-checksums: subjects.sha256
          sbom-path: sboms/${{ matrix.sbom }}

  publish:
    name: Publish draft release
    needs: [plan, sign-windows, sign-updater, attest-sboms]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.sign-updater.result == 'success' && needs.attest-sboms.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag_name }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts

      - name: Download the Linux build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: build-linux
          path: release-assets

      - name: Download the signed macOS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signed-macos
          path: release-assets

      - name: Download the signed MSI
        if: needs.sign-windows.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signed-windows
          path: release-assets

      - name: Download the unsigned MSI
        if: needs.sign-windows.result != 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: build-windows
          path: release-assets

      - name: Download the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sboms
          path: release-assets

      - name: Download the signatures, checksums and manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signed-updater
          path: release-assets

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes
          path: release-notes

      - name: Require the signed set, byte for byte
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release_assets.py check --dir release-assets --version "$VERSION" --set published
          (cd release-assets && sha256sum --check --strict SHA256SUMS.txt)

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Create or update the draft release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          TAG: ${{ needs.plan.outputs.tag_name }}
          NOTES_PATH: release-notes/CHANGELOG_RELEASE.md
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.TAG;
            const body = fs.readFileSync(process.env.NOTES_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            let release = releases.data.find(r => r.tag_name === tag);
            if (release) {
              core.info(`Release for ${tag} already exists (id=${release.id}), reusing.`);
              await github.rest.repos.updateRelease({
                owner, repo,
                release_id: release.id,
                name: `Writ ${tag}`,
                body,
                draft: true,
                prerelease: tag.includes('-'),
              });
            } else {
              core.info(`Creating draft release ${tag}`);
              await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                name: `Writ ${tag}`,
                body,
                draft: true,
                prerelease: tag.includes('-'),
              });
            }

      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-assets/* --clobber --repo "$REPO"
          echo "Release left as draft. Publish it by hand (docs/RELEASING.md 2.6)."
