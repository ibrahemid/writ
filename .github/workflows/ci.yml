name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Required checks need a status: a job-level `if` reports skipped, trigger `paths` leaves Expected.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      site: ${{ steps.classify.outputs.site }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          all=0
          files=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git rev-parse --verify --quiet "origin/${BASE_REF}" >/dev/null \
              || git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
              || all=1
            if [ "${all}" -eq 0 ] && ! files=$(git diff --name-only "origin/${BASE_REF}...HEAD"); then
              all=1
            fi
          elif [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            all=1
          elif ! files=$(git diff --name-only "${BEFORE}..HEAD"); then
            all=1
          fi

          if [ "${all}" -eq 0 ] && [ -z "${files}" ]; then
            all=1
          fi

          code=false
          site=false
          if [ "${all}" -eq 1 ]; then
            code=true
            site=true
            echo "no usable diff: treating every path as changed"
          else
            echo "changed files:"
            echo "${files}"
            while IFS= read -r file; do
              [ -n "${file}" ] || continue
              case "${file}" in
                docs/*|.github/*.md|*.md|.status/*|LICENSE*|.gitignore|.github/ISSUE_TEMPLATE/*) ;;
                *) code=true ;;
              esac
              case "${file}" in
                site/*|.github/workflows/ci.yml|src/*|demo/*|scripts/capture/fixtures/*|vite.demo.config.ts|package.json|pnpm-lock.yaml) site=true ;;
              esac
            done <<< "${files}"
          fi

          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "site=${site}" >> "${GITHUB_OUTPUT}"
          echo "decision: code=${code} site=${site}"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            cross_only: false
          - os: macos-latest
            label: macOS
            cross_only: true
          - os: windows-latest
            label: Windows
            cross_only: true

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: 1
        run: rustup toolchain install --no-self-update

      - name: Lockfile guards
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if grep -q '^\[\[patch.unused\]\]' Cargo.lock; then
            echo "::error file=Cargo.lock::Cargo.lock lists [[patch.unused]]: a [patch.crates-io] entry no longer applies"
            exit 1
          fi
          cargo metadata --locked --format-version 1 > /dev/null

      - name: Install cargo-deny
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8  # v2.87.28
        with:
          tool: cargo-deny@0.20.2

      - name: Dependency policy
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny --locked check advisories bans licenses sources

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Design tokens are current
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm tokens:build
          pnpm icons:build
          git diff --exit-code -- src/styles/generated src-tauri/assets/generated site/src/styles/tokens.css src/components/Icon/sprite.generated.ts
          test -z "$(git status --porcelain -- src/styles/generated src-tauri/assets/generated site/src/styles/tokens.css src/components/Icon/sprite.generated.ts)"

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --check

      # Compiling writ-tauri (clippy, tests, check) runs the Tauri build
      # script, which requires the CLI sidecar to exist for the host triple.
      - name: Build CLI sidecar
        shell: bash
        run: |
          set -euo pipefail
          HOST_TRIPLE="$(rustc -vV | sed -n 's/host: //p')"
          cargo build -p writ-cli --locked
          mkdir -p src-tauri/binaries
          EXT=""
          case "$HOST_TRIPLE" in *windows*) EXT=".exe";; esac
          cp "target/debug/writ${EXT}" "src-tauri/binaries/writ-${HOST_TRIPLE}${EXT}"

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy (release profile)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --release --locked -- -D warnings

      - name: Run tests
        # Cross-OS tests run once on main, after integration.
        if: matrix.cross_only == false || github.event_name == 'push'
        run: cargo test --workspace --locked

      - name: Release script tests
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s .github/scripts -t .github/scripts

      - name: Script tests
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Install cargo-about
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8  # v2.87.28
        with:
          tool: cargo-about@0.9.1

      - name: Third-party notices are current
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/gen-third-party-notices.py --check

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Frontend tests
        if: matrix.os == 'ubuntu-latest'
        run: pnpm exec vitest run

      - name: Frontend build
        run: pnpm build

      - name: Tauri build check
        run: cargo check --lib -p writ-tauri --locked

  # The preview exfil probe (ADR-043): the preview as it ships, in a real
  # webview, with every vector aimed at a local sink. Unlike the cross-OS unit
  # tests, this runs on every PR on all three engines (Windows regressions must
  # not wait for the push-to-main run), under WRIT_ENGINE_PROBE=1 and a display
  # (xvfb on Linux). Each leg routes writ-probe.test to the probe's DNS sink at
  # dns_addr; an empty dns_addr runs that leg without the DNS sink.
  engine-probe:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            dns_addr: "127.0.0.1:5533"
          - os: macos-latest
            label: macOS
            dns_addr: "127.0.0.1:5533"
          # NRPT names a server without a port, so the Windows sink takes 53.
          - os: windows-latest
            label: Windows
            dns_addr: "127.0.0.1:53"

    name: Preview exfil probe (${{ matrix.label }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        env:
          RUSTUP_PERMIT_COPY_RENAME: 1
        run: rustup toolchain install --no-self-update

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            xvfb

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: ". -> target"

      # Compiling writ-tauri runs the Tauri build script, which needs the CLI
      # sidecar for the host triple.
      - name: Build CLI sidecar
        shell: bash
        run: |
          set -euo pipefail
          HOST_TRIPLE="$(rustc -vV | sed -n 's/host: //p')"
          cargo build -p writ-cli --locked
          mkdir -p src-tauri/binaries
          EXT=""
          case "$HOST_TRIPLE" in *windows*) EXT=".exe";; esac
          cp "target/debug/writ${EXT}" "src-tauri/binaries/writ-${HOST_TRIPLE}${EXT}"

      # A global server, so resolved does not bind the query to a link.
      - name: Route the probe domain to the DNS sink (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.dns_addr != ''
        run: |
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\nDNS=127.0.0.1:5533\nDomains=~writ-probe.test\n' | sudo tee /etc/systemd/resolved.conf.d/writ-probe.conf
          sudo systemctl restart systemd-resolved

      - name: Route the probe domain to the DNS sink (macOS)
        if: matrix.os == 'macos-latest' && matrix.dns_addr != ''
        run: |
          sudo mkdir -p /etc/resolver
          printf 'nameserver 127.0.0.1\nport 5533\n' | sudo tee /etc/resolver/writ-probe.test
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder

      - name: Route the probe domain to the DNS sink (Windows)
        if: matrix.os == 'windows-latest' && matrix.dns_addr != ''
        shell: pwsh
        run: Add-DnsClientNrptRule -Namespace ".writ-probe.test" -NameServers "127.0.0.1"

      - name: Run the exfil probe (Linux, under xvfb)
        if: matrix.os == 'ubuntu-latest'
        env:
          WRIT_ENGINE_PROBE: "1"
          WRIT_ENGINE_PROBE_DNS_DOMAIN: writ-probe.test
          WRIT_ENGINE_PROBE_DNS_ADDR: ${{ matrix.dns_addr }}
        run: xvfb-run -a cargo test -p writ-tauri --test engine_probe --locked -- --nocapture

      - name: Run the exfil probe (macOS / Windows)
        if: matrix.os != 'ubuntu-latest'
        env:
          WRIT_ENGINE_PROBE: "1"
          WRIT_ENGINE_PROBE_DNS_DOMAIN: writ-probe.test
          WRIT_ENGINE_PROBE_DNS_ADDR: ${{ matrix.dns_addr }}
        run: cargo test -p writ-tauri --test engine_probe --locked -- --nocapture

  site:
    name: Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml

      - name: Install app dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build the app for the hero
        working-directory: .
        run: pnpm build:demo

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Astro check
        run: pnpm run check

      - name: Site tests
        run: pnpm test

      - name: Site build
        run: pnpm build

      - name: Check the built output
        run: pnpm run test:dist

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      # The scan walks the base..head commit range, so it needs full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"

  zizmor:
    name: Workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
