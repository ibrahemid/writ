name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            cross_only: false
          - os: macos-latest
            label: macOS
            cross_only: true
          - os: windows-latest
            label: Windows
            cross_only: true

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
        continue-on-error: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Design tokens are current
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm tokens:build
          git diff --exit-code -- src/styles/generated src-tauri/assets/generated site/design-system/generated
          test -z "$(git status --porcelain -- src/styles/generated src-tauri/assets/generated site/design-system/generated)"

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --check

      # Compiling writ-tauri (clippy, tests, check) runs the Tauri build
      # script, which requires the CLI sidecar to exist for the host triple.
      - name: Build CLI sidecar
        shell: bash
        run: |
          set -euo pipefail
          HOST_TRIPLE="$(rustc -vV | sed -n 's/host: //p')"
          cargo build -p writ-cli
          mkdir -p src-tauri/binaries
          EXT=""
          case "$HOST_TRIPLE" in *windows*) EXT=".exe";; esac
          cp "target/debug/writ${EXT}" "src-tauri/binaries/writ-${HOST_TRIPLE}${EXT}"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Release script tests
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s .github/scripts -t .github/scripts

      - name: Security audit
        run: cargo audit
        continue-on-error: true

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Frontend tests
        if: matrix.os == 'ubuntu-latest'
        run: pnpm exec vitest run

      - name: Frontend build
        run: pnpm build

      - name: Tauri build check
        run: cargo check --lib -p writ-tauri

  site:
    name: Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Astro check
        run: pnpm run check

      - name: Site tests
        run: pnpm test

      - name: Site build
        run: pnpm build

      - name: Check the built output
        run: pnpm run test:dist

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      # The scan walks the base..head commit range, so it needs full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
