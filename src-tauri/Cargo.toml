[package]
name = "writ-tauri"
description = "Tauri application shell and IPC adapter for the Writ editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "writ_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
writ-core = { path = "../crates/writ-core" }
writ-lint = { path = "../crates/writ-lint" }
writ-render = { path = "../crates/writ-render" }
writ-storage = { path = "../crates/writ-storage", features = ["bundled"] }
writ-plugin = { path = "../crates/writ-plugin" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
notify = "8"
notify-debouncer-mini = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = "0.4"
thiserror = "2"
url = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Reuse the reqwest already resolved via tauri-plugin-updater (rustls, no
# native-tls). Only `stream` (SSE byte stream) and `json` (request body) are
# added; the TLS provider stays `rustls-no-provider` from the updater so the
# rustls `ring` provider is used and aws-lc-rs / quinn stay out of the tree.
reqwest = { version = "0.13", default-features = false, features = [
    "stream",
    "json",
] }
# The `ring` crypto provider is installed at request time (mirroring the
# updater's guard) so a `rustls-no-provider` client never panics.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
futures-util = "0.3"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# A startup failure has to be shown before the Tauri builder runs, so
# tauri-plugin-dialog is not available yet. rfd is the plugin's own backend
# and is already in the tree; taking it directly with no default features
# links the AppKit / win32 message box and nothing else. Excluded on Linux,
# where rfd's dialogs would add GTK as a direct build dependency of this
# crate; see startup_failure::show_failure_dialog_via_command.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { version = "0.16", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
keyring = { version = "3", features = ["apple-native"] }
# The same objc2 line tauri, tao and wry already resolve, so this unifies
# rather than adding a second copy of the AppKit bindings. Needed to install
# `applicationShouldTerminate:`, which nothing above this crate exposes.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
dispatch2 = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Same 0.61 line tao/wry already resolve, so this unifies rather than adding a
# second copy of the Win32 bindings.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
