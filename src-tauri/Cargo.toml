[package]
name = "writ-tauri"
description = "Tauri application shell and IPC adapter for the Writ editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "writ_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
writ-ai = { path = "../crates/writ-ai" }
writ-core = { path = "../crates/writ-core" }
writ-lint = { path = "../crates/writ-lint" }
writ-render = { path = "../crates/writ-render" }
writ-storage = { path = "../crates/writ-storage", features = ["bundled"] }
writ-plugin = { path = "../crates/writ-plugin" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
# Without `zip`: releases sign the .msi and .AppImage themselves
# (`createUpdaterArtifacts: true`), so no wrapped installer is unpacked.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
notify = "8"
notify-debouncer-mini = "0.7"
hashbrown = { version = "0.16", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
chrono = "0.4"
thiserror = "2"
url = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# The client type the OpenRouter connect flow and the chat wrappers name; the
# client itself is built by writ-ai, which also installs the rustls provider.
reqwest = { version = "0.13", default-features = false, features = [
    "stream",
    "json",
] }
tokio-util = { version = "0.7", default-features = false }
# The pickers await the dialog's answer on a oneshot rather than parking a
# runtime worker on a blocking receive (ADR-047). Already in the tree under
# tauri; this is the edge, not a new package.
tokio = { version = "1", default-features = false, features = ["sync"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
# The OS entropy source, already in the tree under rustls/ring. Taken directly
# for the PKCE verifier and state of the connect flow (ADR-040 section 6); no
# generator crate is added, because 48 bytes read once per flow is all that is
# wanted.
getrandom = "0.4"

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# A startup failure has to be shown before the Tauri builder runs, so
# tauri-plugin-dialog is not available yet. rfd is the plugin's own backend
# and is already in the tree; taking it directly with no default features
# links the AppKit / win32 message box and nothing else. Excluded on Linux,
# where rfd's dialogs would add GTK as a direct build dependency of this
# crate; see startup_failure::show_failure_dialog_via_command.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { version = "0.16", default-features = false }

# access(2) for the updater's check that the directory it writes into is
# writable. The rustix tempfile already resolves on every unix target.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
fsevent-sys = "4"
# The same objc2 line tauri, tao and wry already resolve, so this unifies
# rather than adding a second copy of the AppKit bindings. Needed to install
# `applicationShouldTerminate:`, which nothing above this crate exposes, and to
# give the keyboard back to the app in front before the capture note.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSWorkspace",
    "libc",
] }
dispatch2 = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
# Same 0.62 line tao/wry already resolve, so this unifies rather than adding a
# second copy of the Win32 bindings.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
toml = "1.1"
# The mock runtime, for the shell budget (tests/shell_budget.rs): a command is
# dispatched the way the webview dispatches it, and the time the dispatching
# thread is held is measured. The feature adds a module and no package.
tauri = { version = "2", features = ["test"] }
# Test-only. The write half of the harness runs in the client's own process,
# and the one thing a unit test cannot prove is that a write from there reaches
# a tab in this one. Not a runtime dependency: nothing in `src/` names it, and
# `writ-mcp` still links no tauri.
writ-mcp = { path = "../crates/writ-mcp" }
# Test-only, for the engine exfil probe (tests/engine_probe.rs): a real webview
# loading the corpus behind a local sink. The same wry (the pinned nil-safe
# fork, via the workspace patch) and tao the app already resolves, so no new
# package enters the lock — only a dev-dep edge. The probe opens a window, so it
# runs only under WRIT_ENGINE_PROBE=1 on a CI leg with a display, never in the
# ordinary unit gate.
wry = "0.57"
tao = "0.37"

# harness = false so the probe's own main() runs on the main thread (tao/wry
# need it; libtest runs tests on worker threads). With no harness #[ignore] does
# not apply, so the probe gates itself on WRIT_ENGINE_PROBE and exits 0 when
# unset — `cargo test --workspace` compiles it and runs a no-op.
[[test]]
name = "engine_probe"
harness = false
