# Licence texts for crates whose published package leaves them out.
#
# cargo-about falls back to the SPDX template when it finds no licence file in a
# crate, which puts "Copyright (c) <year> <copyright holders>" where the real
# notice belongs. Most of those crates do ship the file under a name cargo-about
# does not look for, and the generator finds those itself. The rest are here:
# each text is the file from the crate's own source repository, pinned to a
# commit.
#
# `unattributed` records the crates that publish no copyright notice anywhere:
# none in the package, none in the repository. Their licence is reproduced with
# the unfilled copyright line removed rather than with a placeholder in it.
#
# scripts/gen-third-party-notices.py reads this offline. A crate that cargo-about
# cannot resolve and that is listed in neither table fails generation, and so
# does an entry here that no longer matches a shipped crate.

[[notice]]
crates = ["dlopen2", "dlopen2_derive"]
licence = "MIT"
file = "dlopen2.txt"
sources = [
    "https://raw.githubusercontent.com/OpenByteDev/dlopen2/cc80e4a0a90d499b677fdf7743699b4b3a43a989/LICENSE",
]

[[notice]]
crates = ["alloc-stdlib"]
licence = "BSD-3-Clause"
file = "rust-alloc-no-stdlib.txt"
sources = [
    "https://raw.githubusercontent.com/dropbox/rust-alloc-no-stdlib/6032b6a9b20e03737135c55a0270ccffcc1438ef/LICENSE",
]

[[notice]]
crates = ["tauri-plugin"]
licence = "MIT"
file = "tauri.txt"
sources = [
    "https://raw.githubusercontent.com/tauri-apps/tauri/9b17a7aeae9a83222ffe829aa4e2d8a5ba6bed8c/LICENSE_MIT",
]

[[notice]]
crates = ["webview2-com", "webview2-com-macros", "webview2-com-sys"]
licence = "MIT"
file = "webview2-rs.txt"
sources = [
    "https://raw.githubusercontent.com/wravery/webview2-rs/b74dc5e2b394044bea5191052868ce7a106c202c/LICENSE",
]

# https://github.com/madsmtm/objc2 carries a LICENSE.md that names the licence
# of each crate and states no copyright.
[[unattributed]]
crates = [
    "block2",
    "dispatch2",
    "objc2",
    "objc2-app-kit",
    "objc2-cloud-kit",
    "objc2-core-data",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-image",
    "objc2-core-text",
    "objc2-core-video",
    "objc2-encode",
    "objc2-exception-helper",
    "objc2-foundation",
    "objc2-osa-kit",
    "objc2-quartz-core",
    "objc2-security",
    "objc2-service-management",
    "objc2-web-kit",
]
licence = "MIT"

